name: ML review pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "results/*_candidates.csv"
      - "results/all_train_candidates.csv"
      - "requirements.txt"
      - ".github/workflows/ml-review.yml"

jobs:
  model-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate candidate dataset
        id: dataset
        shell: bash
        run: |
          if [ ! -f "results/all_train_candidates.csv" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ML review not run::The full results/all_train_candidates.csv file is missing."
            exit 0
          fi

          TRIPS=$(python - <<'PY'
          import pandas as pd
          path = "results/all_train_candidates.csv"
          data = pd.read_csv(path, usecols=["trip_id"])
          print(data["trip_id"].nunique())
          PY
          )
          echo "Detected $TRIPS distinct trip IDs."
          if [ "$TRIPS" -lt 11 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ML review not run::Only $TRIPS distinct trips are present. The 70/10 grouped holdout requires at least 11 trips; the supplied review dataset should contain 80."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare five baseline models
        if: steps.dataset.outputs.available == 'true'
        run: python -m src.compare_models

      - name: Train final baseline model
        if: steps.dataset.outputs.available == 'true'
        run: python -m src.train

      - name: Generate comparison visualisation
        if: steps.dataset.outputs.available == 'true'
        run: python -m src.plot_results

      - name: Upload review outputs
        if: steps.dataset.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pathsnap-ml-review-results
          if-no-files-found: warn
          path: |
            results/model_comparison.csv
            results/model_comparison.png
            models/candidate_classifier.joblib
            models/metadata.json
